name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore
      run: dotnet restore BdoUaClient.sln

    - name: Build
      run: dotnet build BdoUaClient.sln --configuration Release --no-restore

    - name: Test
      run: dotnet test BdoUaClient.sln --configuration Release --no-build

    - name: Version resolver tests
      shell: pwsh
      run: scripts/Test-Resolve-ReleaseVersion.ps1
