name: Test Build

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore
      run: dotnet restore BdoUaClient.sln

    - name: Build Release
      run: dotnet build BdoUaClient.sln -c Release --no-restore

    - name: Test Release
      run: dotnet test BdoUaClient.sln -c Release --no-build

    - name: Publish single-file win-x64
      run: >
        dotnet publish BdoClient.csproj
        -c Release
        -r win-x64
        --self-contained true
        -p:PublishSingleFile=true
        -p:IncludeNativeLibrariesForSelfExtract=true
        -p:PublishTrimmed=false
        -p:AssemblyName=BDO-UA-Client
        -o artifacts/publish/win-x64

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: BDO-UA-Client-test-build
        path: artifacts/publish/win-x64/BDO-UA-Client.exe
