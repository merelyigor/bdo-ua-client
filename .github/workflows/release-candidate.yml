name: Release Candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version MAJOR.MINOR.PATCH. Leave empty for automatic next patch.'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  release-candidate:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Validate main branch
      shell: pwsh
      run: |
        $ref = "${{ github.ref }}"
        if ($ref -ne "refs/heads/main") {
          Write-Error "Release Candidate must be dispatched from main. Current ref: $ref"
          exit 1
        }
        Write-Output "Branch validated: main"

    - name: Resolve release version
      id: resolve
      shell: pwsh
      run: |
        $manualVersion = "${{ inputs.version }}"
        $result = & "${{ github.workspace }}\scripts\Resolve-ReleaseVersion.ps1" -ManualVersion $manualVersion

        # Parse output
        $versionLine = $result | Where-Object { $_ -match '^RELEASE_VERSION=' }
        $tagLine = $result | Where-Object { $_ -match '^RELEASE_TAG=' }
        $logLines = $result | Where-Object { $_ -notmatch '^RELEASE_' }

        # Print log
        $logLines | ForEach-Object { Write-Output $_ }

        $version = ($versionLine -split '=', 2)[1]
        $tag = ($tagLine -split '=', 2)[1]

        Write-Output "RELEASE_VERSION=$version" >> $env:GITHUB_OUTPUT
        Write-Output "RELEASE_TAG=$tag" >> $env:GITHUB_OUTPUT
        Write-Output "Resolved: $version ($tag)"

    - name: Check tag does not exist (local + remote)
      shell: pwsh
      run: |
        $tag = "${{ steps.resolve.outputs.RELEASE_TAG }}"

        $local = git tag -l $tag
        if ($local) {
          Write-Error "Tag $tag already exists locally."
          exit 1
        }

        $remoteOutput = git ls-remote origin "refs/tags/$tag" 2>&1
        if ($LASTEXITCODE -ne 0) {
          Write-Error "Failed to query remote for tag $tag (exit code $LASTEXITCODE)"
          exit 1
        }
        if ($remoteOutput) {
          Write-Error "Tag $tag already exists on remote."
          exit 1
        }

        Write-Output "Tag $tag is available (local + remote)"

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore
      run: dotnet restore BdoUaClient.sln

    - name: Build Release
      shell: pwsh
      run: |
        $version = "${{ steps.resolve.outputs.RELEASE_VERSION }}"
        $parts = $version.Split('.')
        $assemblyVersion = "$($parts[0]).$($parts[1]).$($parts[2]).0"

        dotnet build BdoUaClient.sln `
          -c Release `
          --no-restore `
          -p:Version=$version `
          -p:AssemblyVersion=$assemblyVersion `
          -p:FileVersion=$assemblyVersion `
          -p:InformationalVersion=$version `
          -p:IncludeSourceRevisionInInformationalVersion=false

    - name: Test Release
      run: dotnet test BdoUaClient.sln -c Release --no-build

    - name: Publish single-file win-x64
      shell: pwsh
      run: |
        $version = "${{ steps.resolve.outputs.RELEASE_VERSION }}"
        $parts = $version.Split('.')
        $assemblyVersion = "$($parts[0]).$($parts[1]).$($parts[2]).0"

        dotnet publish BdoClient.csproj `
          -c Release `
          -r win-x64 `
          --self-contained true `
          -p:PublishSingleFile=true `
          -p:IncludeNativeLibrariesForSelfExtract=true `
          -p:PublishTrimmed=false `
          -p:AssemblyName=BDO-UA-Client `
          -p:Version=$version `
          -p:AssemblyVersion=$assemblyVersion `
          -p:FileVersion=$assemblyVersion `
          -p:InformationalVersion=$version `
          -p:IncludeSourceRevisionInInformationalVersion=false `
          -o artifacts/publish/win-x64

    - name: Verify EXE exists
      shell: pwsh
      run: |
        $exe = "artifacts/publish/win-x64/BDO-UA-Client.exe"
        if (!(Test-Path $exe)) {
          Write-Error "EXE not found at $exe"
          exit 1
        }
        $size = (Get-Item $exe).Length
        Write-Output "EXE found: $size bytes"

    - name: Verify EXE version metadata
      shell: pwsh
      run: |
        $exe = "artifacts/publish/win-x64/BDO-UA-Client.exe"
        $info = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($exe)
        $version = "${{ steps.resolve.outputs.RELEASE_VERSION }}"
        $expectedFileVersion = "$version.0"

        Write-Output "Expected FileVersion:    $expectedFileVersion"
        Write-Output "Actual FileVersion:      $($info.FileVersion)"
        Write-Output "Expected ProductVersion: $version"
        Write-Output "Actual ProductVersion:   $($info.ProductVersion)"

        if ($info.FileVersion -ne $expectedFileVersion) {
          Write-Error "FileVersion '$($info.FileVersion)' does not exactly equal '$expectedFileVersion'"
          exit 1
        }
        if ($info.ProductVersion -ne $version) {
          Write-Error "ProductVersion '$($info.ProductVersion)' does not exactly equal '$version'"
          exit 1
        }
        Write-Output "EXE version metadata verified (exact match)"

    - name: Prepare flat release artifact
      shell: pwsh
      run: |
        $sourceExe = "artifacts/publish/win-x64/BDO-UA-Client.exe"
        $flatExe = "artifacts/BDO-UA-Client.exe"
        Copy-Item -LiteralPath $sourceExe -Destination $flatExe -Force

        $sourceHash = (Get-FileHash -Path $sourceExe -Algorithm SHA256).Hash.ToLower()
        $flatHash = (Get-FileHash -Path $flatExe -Algorithm SHA256).Hash.ToLower()
        if ($sourceHash -ne $flatHash) {
          Write-Error "Flat EXE is not byte-identical to published EXE."
          exit 1
        }
        Write-Output "Flat release EXE prepared: $flatExe ($((Get-Item $flatExe).Length) bytes)"

    - name: Calculate SHA-256
      shell: pwsh
      run: |
        $assetName = "BDO-UA-Client.exe"
        $exePath = "artifacts/$assetName"
        $hash = (Get-FileHash -Path $exePath -Algorithm SHA256).Hash.ToLower()
        "$hash  $assetName" | Out-File -FilePath "artifacts/SHA256SUMS.txt" -Encoding utf8
        Write-Output "SHA-256: $hash"

    - name: Create release manifest
      shell: pwsh
      run: |
        $version = "${{ steps.resolve.outputs.RELEASE_VERSION }}"
        $tag = "${{ steps.resolve.outputs.RELEASE_TAG }}"
        $sha = "${{ github.sha }}"
        $assetName = "BDO-UA-Client.exe"
        $hash = (Get-Content "artifacts/SHA256SUMS.txt" -Raw).Split(" ")[0]
        $runId = "${{ github.run_id }}"

        $manifest = @{
          schema_version = 1
          version = $version
          tag = $tag
          commit_sha = $sha
          asset_name = $assetName
          sha256 = $hash
          platform = "win-x64"
          workflow_run_id = $runId
        } | ConvertTo-Json -Depth 2

        $manifest | Out-File -FilePath "artifacts/release-manifest.json" -Encoding utf8
        Write-Output "release-manifest.json created"

    - name: Generate release notes (auto from git log)
      shell: pwsh
      run: |
        $version = "${{ steps.resolve.outputs.RELEASE_VERSION }}"
        $tag = "${{ steps.resolve.outputs.RELEASE_TAG }}"
        $sha = "${{ github.sha }}"
        $assetName = "BDO-UA-Client.exe"
        $hash = (Get-Content "artifacts/SHA256SUMS.txt" -Raw).Split(" ")[0]

        $notes = & "${{ github.workspace }}\scripts\Generate-ReleaseNotes.ps1" `
          -Version $version `
          -Tag $tag `
          -Sha $sha `
          -AssetName $assetName `
          -Sha256 $hash

        $notes | Out-File -FilePath "artifacts/RELEASE_NOTES-v$version.md" -Encoding utf8
        Write-Output "RELEASE_NOTES-v$version.md generated from git log"
        Write-Output ""
        Write-Output $notes

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: BDO-UA-Client-v${{ steps.resolve.outputs.RELEASE_VERSION }}-win-x64
        path: |
          artifacts/BDO-UA-Client.exe
          artifacts/SHA256SUMS.txt
          artifacts/release-manifest.json
          artifacts/RELEASE_NOTES-v${{ steps.resolve.outputs.RELEASE_VERSION }}.md

    - name: Summary
      shell: pwsh
      run: |
        $version = "${{ steps.resolve.outputs.RELEASE_VERSION }}"
        $tag = "${{ steps.resolve.outputs.RELEASE_TAG }}"
        $sha = "${{ github.sha }}"
        $assetName = "BDO-UA-Client.exe"
        $hash = (Get-Content "artifacts/SHA256SUMS.txt" -Raw).Split(" ")[0]
        $inputVersion = "${{ inputs.version }}"
        if ($inputVersion -and $inputVersion.Trim() -ne "") {
          $source = "Manual"
        } else {
          $source = "Automatic patch"
        }

        @"
        ## Release Candidate v$version

        | | |
        |---|---|
        | **Version source** | $source |
        | **Version** | $version |
        | **Tag** | ``$tag`` (will be created after this step) |
        | **Commit** | ``$sha`` |
        | **Asset** | $assetName |
        | **SHA-256** | ``$hash`` |
        | **Artifact** | ``BDO-UA-Client-v$version-win-x64`` |

        ### Artifact contents

        Downloaded GitHub Actions artifact (GitHub's transport wrapper) contains flat files:
        - ``BDO-UA-Client.exe`` — the application
        - ``SHA256SUMS.txt``
        - ``release-manifest.json``
        - ``RELEASE_NOTES-v$version.md``

        ### Next steps

        1. Download artifact ``BDO-UA-Client-v$version-win-x64``
        2. Test locally
        3. Verify SHA-256 if desired
        4. Draft GitHub Release → select existing tag ``$tag``
        5. Use generated ``RELEASE_NOTES-v$version.md`` as release body (auto-generated from commits, edit if needed)
        6. Upload the EXACT ``BDO-UA-Client.exe`` from the artifact (do NOT ZIP or repackage it)
        7. Upload ``SHA256SUMS.txt`` to GitHub Release
        8. Upload ``release-manifest.json`` to GitHub Release
        9. Click **Publish release**

        > GitHub Release is NOT created automatically.
        "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8

    - name: Create and push tag (FINAL)
      shell: pwsh
      run: |
        $tag = "${{ steps.resolve.outputs.RELEASE_TAG }}"
        $sha = "${{ github.sha }}"

        $remoteOutput = git ls-remote origin "refs/tags/$tag" 2>&1
        if ($LASTEXITCODE -ne 0) {
          Write-Error "Failed to query remote for tag $tag (exit code $LASTEXITCODE)"
          exit 1
        }
        if ($remoteOutput) {
          Write-Error "Tag $tag was created on remote by another process. Aborting."
          exit 1
        }

        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git tag -a $tag -m "Release $tag" $sha
        git push origin $tag
        Write-Output "Tag $tag created and pushed on $sha"
