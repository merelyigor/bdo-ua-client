name: Release Candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version MAJOR.MINOR.PATCH. Leave empty for automatic next patch.'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  release-candidate:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Validate main branch
      shell: pwsh
      run: |
        $ref = "${{ github.ref }}"
        if ($ref -ne "refs/heads/main") {
          Write-Error "Release Candidate must be dispatched from main. Current ref: $ref"
          exit 1
        }
        Write-Output "Branch validated: main"

    - name: Resolve release version
      id: resolve
      shell: pwsh
      run: |
        $manualVersion = "${{ inputs.version }}"
        $result = & "${{ github.workspace }}\scripts\Resolve-ReleaseVersion.ps1" -ManualVersion $manualVersion

        # Parse output
        $versionLine = $result | Where-Object { $_ -match '^RELEASE_VERSION=' }
        $tagLine = $result | Where-Object { $_ -match '^RELEASE_TAG=' }
        $logLines = $result | Where-Object { $_ -notmatch '^RELEASE_' }

        # Print log
        $logLines | ForEach-Object { Write-Output $_ }

        $version = ($versionLine -split '=', 2)[1]
        $tag = ($tagLine -split '=', 2)[1]

        Write-Output "RELEASE_VERSION=$version" >> $env:GITHUB_OUTPUT
        Write-Output "RELEASE_TAG=$tag" >> $env:GITHUB_OUTPUT
        Write-Output "Resolved: $version ($tag)"

    - name: Check tag does not exist (local + remote)
      shell: pwsh
      run: |
        $tag = "${{ steps.resolve.outputs.RELEASE_TAG }}"

        $local = git tag -l $tag
        if ($local) {
          Write-Error "Tag $tag already exists locally."
          exit 1
        }

        $remote = git ls-remote origin "refs/tags/$tag"
        if ($remote) {
          Write-Error "Tag $tag already exists on remote."
          exit 1
        }

        Write-Output "Tag $tag is available (local + remote)"

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore
      run: dotnet restore BdoUaClient.sln

    - name: Build Release
      shell: pwsh
      run: |
        $version = "${{ steps.resolve.outputs.RELEASE_VERSION }}"
        $parts = $version.Split('.')
        $assemblyVersion = "$($parts[0]).$($parts[1]).$($parts[2]).0"

        dotnet build BdoUaClient.sln `
          -c Release `
          --no-restore `
          -p:Version=$version `
          -p:AssemblyVersion=$assemblyVersion `
          -p:FileVersion=$assemblyVersion `
          -p:InformationalVersion=$version

    - name: Test Release
      run: dotnet test BdoUaClient.sln -c Release --no-build

    - name: Publish single-file win-x64
      shell: pwsh
      run: |
        $version = "${{ steps.resolve.outputs.RELEASE_VERSION }}"
        $parts = $version.Split('.')
        $assemblyVersion = "$($parts[0]).$($parts[1]).$($parts[2]).0"

        dotnet publish BdoClient.csproj `
          -c Release `
          -r win-x64 `
          --self-contained true `
          -p:PublishSingleFile=true `
          -p:IncludeNativeLibrariesForSelfExtract=true `
          -p:PublishTrimmed=false `
          -p:AssemblyName=BDO-UA-Client `
          -p:Version=$version `
          -p:AssemblyVersion=$assemblyVersion `
          -p:FileVersion=$assemblyVersion `
          -p:InformationalVersion=$version `
          -o artifacts/publish/win-x64

    - name: Verify EXE exists
      shell: pwsh
      run: |
        $exe = "artifacts/publish/win-x64/BDO-UA-Client.exe"
        if (!(Test-Path $exe)) {
          Write-Error "EXE not found at $exe"
          exit 1
        }
        $size = (Get-Item $exe).Length
        Write-Output "EXE found: $size bytes"

    - name: Verify EXE version metadata
      shell: pwsh
      run: |
        $exe = "artifacts/publish/win-x64/BDO-UA-Client.exe"
        $info = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($exe)
        $version = "${{ steps.resolve.outputs.RELEASE_VERSION }}"

        Write-Output "FileVersion:    $($info.FileVersion)"
        Write-Output "ProductVersion: $($info.ProductVersion)"

        if ($info.FileVersion -notlike "$version*") {
          Write-Error "FileVersion '$($info.FileVersion)' does not start with '$version'"
          exit 1
        }
        if ($info.ProductVersion -notlike "$version*") {
          Write-Error "ProductVersion '$($info.ProductVersion)' does not start with '$version'"
          exit 1
        }
        Write-Output "EXE version metadata verified"

    - name: Create versioned ZIP
      shell: pwsh
      run: |
        $version = "${{ steps.resolve.outputs.RELEASE_VERSION }}"
        $assetName = "BDO-UA-Client-v$version-win-x64.zip"
        $exePath = "artifacts/publish/win-x64/BDO-UA-Client.exe"
        $zipPath = "artifacts/$assetName"

        Compress-Archive -Path $exePath -DestinationPath $zipPath -Force
        Write-Output "ZIP created: $zipPath ($((Get-Item $zipPath).Length) bytes)"

    - name: Verify ZIP contents
      shell: pwsh
      run: |
        $version = "${{ steps.resolve.outputs.RELEASE_VERSION }}"
        $zipPath = "artifacts/BDO-UA-Client-v$version-win-x64.zip"
        Add-Type -AssemblyName System.IO.Compression.FileSystem
        $zip = [System.IO.Compression.ZipFile]::OpenRead($zipPath)
        $entries = @($zip.Entries | ForEach-Object { [string]$_.FullName })
        $zip.Dispose()

        Write-Output "ZIP entries: $($entries -join ', ')"

        if ($entries.Count -ne 1) {
          Write-Error "ZIP must contain exactly 1 file. Found: $($entries.Count)"
          exit 1
        }
        if ($entries[0] -ne "BDO-UA-Client.exe") {
          Write-Error "ZIP must contain BDO-UA-Client.exe. Found: $($entries[0])"
          exit 1
        }
        Write-Output "ZIP contents verified"

    - name: Calculate SHA-256
      shell: pwsh
      run: |
        $version = "${{ steps.resolve.outputs.RELEASE_VERSION }}"
        $zipPath = "artifacts/BDO-UA-Client-v$version-win-x64.zip"
        $hash = (Get-FileHash -Path $zipPath -Algorithm SHA256).Hash.ToLower()
        $assetName = "BDO-UA-Client-v$version-win-x64.zip"
        "$hash  $assetName" | Out-File -FilePath "artifacts/SHA256SUMS.txt" -Encoding utf8
        Write-Output "SHA-256: $hash"

    - name: Create release manifest
      shell: pwsh
      run: |
        $version = "${{ steps.resolve.outputs.RELEASE_VERSION }}"
        $tag = "${{ steps.resolve.outputs.RELEASE_TAG }}"
        $sha = "${{ github.sha }}"
        $assetName = "BDO-UA-Client-v$version-win-x64.zip"
        $hash = (Get-Content "artifacts/SHA256SUMS.txt" -Raw).Split(" ")[0]
        $runId = "${{ github.run_id }}"

        $manifest = @{
          schema_version = 1
          version = $version
          tag = $tag
          commit_sha = $sha
          asset_name = $assetName
          sha256 = $hash
          platform = "win-x64"
          workflow_run_id = $runId
        } | ConvertTo-Json -Depth 2

        $manifest | Out-File -FilePath "artifacts/release-manifest.json" -Encoding utf8
        Write-Output "release-manifest.json created"

    - name: Generate release notes
      shell: pwsh
      run: |
        $version = "${{ steps.resolve.outputs.RELEASE_VERSION }}"
        $tag = "${{ steps.resolve.outputs.RELEASE_TAG }}"
        $sha = "${{ github.sha }}"
        $assetName = "BDO-UA-Client-v$version-win-x64.zip"
        $hash = (Get-Content "artifacts/SHA256SUMS.txt" -Raw).Split(" ")[0]

        $template = Get-Content "docs/releases/RELEASE_TEMPLATE.md" -Raw
        $notes = $template `
          -replace '\{\{VERSION\}\}', $version `
          -replace '\{\{TAG\}\}', $tag `
          -replace '\{\{COMMIT_SHA\}\}', $sha `
          -replace '\{\{SHA256\}\}', $hash `
          -replace '\{\{ASSET_NAME\}\}', $assetName

        $notes | Out-File -FilePath "artifacts/RELEASE_NOTES-v$version.md" -Encoding utf8
        Write-Output "RELEASE_NOTES-v$version.md generated"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: BDO-UA-Client-v${{ steps.resolve.outputs.RELEASE_VERSION }}-win-x64
        path: |
          artifacts/BDO-UA-Client-v${{ steps.resolve.outputs.RELEASE_VERSION }}-win-x64.zip
          artifacts/SHA256SUMS.txt
          artifacts/release-manifest.json
          artifacts/RELEASE_NOTES-v${{ steps.resolve.outputs.RELEASE_VERSION }}.md

    - name: Summary
      shell: pwsh
      run: |
        $version = "${{ steps.resolve.outputs.RELEASE_VERSION }}"
        $tag = "${{ steps.resolve.outputs.RELEASE_TAG }}"
        $sha = "${{ github.sha }}"
        $assetName = "BDO-UA-Client-v$version-win-x64.zip"
        $hash = (Get-Content "artifacts/SHA256SUMS.txt" -Raw).Split(" ")[0]
        $inputVersion = "${{ inputs.version }}"
        if ($inputVersion -and $inputVersion.Trim() -ne "") {
          $source = "Manual"
        } else {
          $source = "Automatic patch"
        }

        @"
        ## Release Candidate v$version

        | | |
        |---|---|
        | **Version source** | $source |
        | **Version** | $version |
        | **Tag** | ``$tag`` (will be created after this step) |
        | **Commit** | ``$sha`` |
        | **Asset** | $assetName |
        | **SHA-256** | ``$hash`` |
        | **Artifact** | ``BDO-UA-Client-v$version-win-x64`` |

        ### Next steps

        1. Download artifact ``BDO-UA-Client-v$version-win-x64``
        2. Test exact ``$assetName`` locally
        3. Verify SHA-256 if desired
        4. Draft GitHub Release → select existing tag ``$tag``
        5. Use generated ``RELEASE_NOTES-v$version.md`` as release body (edit changelog)
        6. Upload exact ``$assetName`` from artifact
        7. Upload ``SHA256SUMS.txt`` from artifact
        8. Upload ``release-manifest.json`` from artifact
        9. Click **Publish release**

        > GitHub Release is NOT created automatically.
        "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8

    - name: Create and push tag (FINAL)
      shell: pwsh
      run: |
        $tag = "${{ steps.resolve.outputs.RELEASE_TAG }}"
        $sha = "${{ github.sha }}"

        $remote = git ls-remote origin "refs/tags/$tag"
        if ($remote) {
          Write-Error "Tag $tag was created on remote by another process. Aborting."
          exit 1
        }

        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git tag -a $tag -m "Release $tag" $sha
        git push origin $tag
        Write-Output "Tag $tag created and pushed on $sha"
